<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaración Jurada Adorni</title>

  <style>
    body {
      margin: 0;
      background: #0a192f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
    }

    .days {
      font-size: 7rem;
      font-weight: bold;
      color: #white;
      margin: 20px 0;
    }

    p {
      font-size: 1.5rem;
      line-height: 1.5;
      margin: 0;
    }

    .signature {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      opacity: 0.5;
      letter-spacing: 2px;
    }

  </style>
</head>
<body>

<div class="container">

  <p>Han pasado</p>

  <div class="days" id="days"></div>

  <p>
    días desde que el Presidente dijo que
    Adorni iba a presentar su declaración jurada.
  </p>

</div>

<div class="signature">
  Yuki
</div>

<script>

const startDate = new Date("2026-05-06");

const today = new Date();

const difference = today - startDate;

const days = Math.floor(difference / (1000 * 60 * 60 * 24));

document.getElementById("days").innerText = days;

</script>

</body>
</html>
