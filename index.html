<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Declaración Jurada Adorni</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; }

body {

  margin: 0;

  background-image: url('Adorni.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  color: white;
  font-family: 'Inter', sans-serif;

  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;

  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.42);
  z-index: -1;
}

/* SIDEBAR */

.sidebar {

  position: fixed;
  top: 24px;
  left: 24px;

  display: flex;
  flex-direction: column;
  gap: 10px;

  z-index: 50;
}

.case-button {

  width: 200px;

  padding: 14px 18px;

  font-size: 14px;
  font-weight: 600;

  border: none;
  border-radius: 14px;

  background: rgba(0,0,0,0.45);
  color: white;

  cursor: pointer;

  text-align: left;

  transition: 0.25s;
}

.case-button:hover {
  background: rgba(255,255,255,0.18);
  transform: translateX(3px);
}

/* PDF */

.pdf-button {
  text-decoration: none;
  display: block;
}

/* CONTENIDO */

.container {

  width: 100%;
  max-width: 760px;

  background: rgba(0,0,0,0.38);

  padding: 46px;

  border-radius: 30px;

  text-align: center;
  backdrop-filter: blur(10px);
}

.subtitle {
  font-size: 0.95rem;
  opacity: 0.75;
  text-transform: uppercase;
}

.days {
  font-size: 6rem;
  font-weight: 800;
  color: #4da6ff;
}

.bottom-text {
  font-size: 1.2rem;
}

/* BLOQUES */

.case-text {

  display: none;

  text-align: left;

  background: rgba(0,0,0,0.45);

  padding: 22px;

  border-radius: 20px;

  margin-top: 20px;
}

/* PERSONAJES */

.character-item { margin-top: 12px; }

.character-button {

  width: 100%;
  padding: 14px;

  border: none;
  border-radius: 12px;

  background: rgba(255,255,255,0.08);
  color: white;

  cursor: pointer;

  text-align: left;
}

.character-description {

  display: none;

  margin-top: 8px;

  padding: 14px;

  background: rgba(255,255,255,0.05);

  border-radius: 12px;
}

/* SIDEBAR FIX */

.signature {
  position: fixed;
  bottom: 10px;
  right: 14px;
  opacity: 0.25;
  font-size: 11px;
}

</style>

</head>

<body>

<!-- BOTONES -->

<div class="sidebar">

  <button class="case-button" onclick="toggleCase()">El caso</button>

  <button class="case-button" onclick="toggleCharacters()">Personajes</button>

  <button class="case-button" onclick="toggleTrips()">Los viajes</button>

  <a class="case-button pdf-button" href="DeclaracionJurada2024.pdf" target="_blank">
    Declaración Jurada 2024
  </a>

</div>

<!-- CONTENIDO -->

<div class="container">

  <p class="subtitle">Desde la promesa presidencial pasaron</p>

  <div class="days" id="days"></div>

  <p class="bottom-text">
    días sin que Manuel Adorni presentara su declaración jurada.
  </p>

  <!-- CASO -->
  <div class="case-text" id="caseText">
    <p>
      El caso Adorni: investigación por presunto enriquecimiento ilícito.
    </p>
  </div>

  <!-- PERSONAJES -->
  <div class="case-text" id="charactersBox">

    <div class="character-item">
      <button class="character-button" onclick="toggleCharacter('adorni')">Manuel Adorni</button>
      <div class="character-description" id="adorni">Investigado principal.</div>
    </div>

  </div>

  <!-- VIAJES -->
  <div class="case-text" id="tripsBox">

    <div class="character-item">
      <button class="character-button" onclick="toggleCharacter('punta')">Punta del Este</button>
      <div class="character-description" id="punta">Viaje bajo análisis.</div>
    </div>

  </div>

</div>

<div class="signature">Yuki</div>

<script>

/* DÍAS */
const startDate = new Date("2026-05-06");
const today = new Date();
const diff = today - startDate;

document.getElementById("days").innerText =
Math.max(0, Math.floor(diff / (1000*60*60*24)));

/* CONTROL */

function closeAll() {
  document.getElementById("caseText").style.display = "none";
  document.getElementById("charactersBox").style.display = "none";
  document.getElementById("tripsBox").style.display = "none";
  closeDesc();
}

function closeDesc() {
  document.querySelectorAll(".character-description")
    .forEach(e => e.style.display = "none");
}

function toggleCase(){
  const el = document.getElementById("caseText");
  const open = el.style.display === "block";
  closeAll();
  if(!open) el.style.display = "block";
}

function toggleCharacters(){
  const el = document.getElementById("charactersBox");
  const open = el.style.display === "block";
  closeAll();
  if(!open) el.style.display = "block";
}

function toggleTrips(){
  const el = document.getElementById("tripsBox");
  const open = el.style.display === "block";
  closeAll();
  if(!open) el.style.display = "block";
}

function toggleCharacter(id){
  const el = document.getElementById(id);
  const open = el.style.display === "block";
  closeDesc();
  if(!open) el.style.display = "block";
}

</script>

</body>
</html>
